name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          CGO_LDFLAGS="-framework UniformTypeIdentifiers" \
            go build -tags "desktop,production" \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o build/bacalhau-bin .

      - name: Build .app bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          APP="build/Bacalhau.app"
          CONTENTS="$APP/Contents"
          mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"

          # Icon: PNG → iconset → icns
          ICONSET="build/icon.iconset"
          mkdir -p "$ICONSET"
          for SIZE in 16 32 128 256 512; do
            sips -z $SIZE $SIZE icons/icon.png --out "$ICONSET/icon_${SIZE}x${SIZE}.png" >/dev/null 2>&1
            DOUBLE=$((SIZE * 2))
            sips -z $DOUBLE $DOUBLE icons/icon.png --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" >/dev/null 2>&1
          done
          sips -z 1024 1024 icons/icon.png --out "$ICONSET/icon_512x512@2x.png" >/dev/null 2>&1
          iconutil -c icns "$ICONSET" -o "$CONTENTS/Resources/icon.icns"

          # Info.plist
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist.template \
            | sed 's|<string>launcher</string>|<string>Bacalhau</string>|' \
            > "$CONTENTS/Info.plist"

          # Binary
          cp build/bacalhau-bin "$CONTENTS/MacOS/Bacalhau"
          chmod +x "$CONTENTS/MacOS/Bacalhau"

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEV_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEV_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERT_BASE64" | base64 -d > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm /tmp/cert.p12

      - name: Sign with Developer ID
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
                      | awk '/Developer ID Application/{print $2; exit}')
          echo "Signing with $IDENTITY"
          codesign --force --options runtime --timestamp \
            --entitlements packaging/macos/Bacalhau.entitlements \
            --sign "$IDENTITY" \
            build/Bacalhau.app
          codesign --verify --strict --verbose=2 build/Bacalhau.app

      - name: Notarize the .app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          rm -f build/Bacalhau.zip
          ditto -c -k --keepParent build/Bacalhau.app build/Bacalhau.zip
          SUBMIT_OUT=$(xcrun notarytool submit build/Bacalhau.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --output-format json \
            --wait)
          echo "$SUBMIT_OUT"
          SUBMIT_ID=$(echo "$SUBMIT_OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          STATUS=$(echo "$SUBMIT_OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          if [ "$STATUS" != "Accepted" ]; then
            echo "::group::notarytool log for $SUBMIT_ID (status=$STATUS)"
            xcrun notarytool log "$SUBMIT_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" || true
            echo "::endgroup::"
            exit 1
          fi
          xcrun stapler staple build/Bacalhau.app
          xcrun stapler validate build/Bacalhau.app

      - name: Build DMG from stapled app
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          rm -f build/Bacalhau-*.dmg build/Bacalhau-rw.dmg
          hdiutil create -size 200m -fs HFS+ -volname "Bacalhau" \
            -srcfolder build/Bacalhau.app \
            -format UDRW build/Bacalhau-rw.dmg
          hdiutil attach build/Bacalhau-rw.dmg \
            -mountpoint /Volumes/Bacalhau -nobrowse -quiet
          ln -sf /Applications /Volumes/Bacalhau/Applications
          hdiutil detach /Volumes/Bacalhau -quiet
          hdiutil convert build/Bacalhau-rw.dmg \
            -format UDZO -imagekey zlib-level=9 \
            -o "build/Bacalhau-${VERSION}-macos.dmg"
          rm -f build/Bacalhau-rw.dmg

      - name: Sign and notarize the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          DMG="build/Bacalhau-${VERSION}-macos.dmg"
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
                      | awk '/Developer ID Application/{print $2; exit}')
          codesign --force --sign "$IDENTITY" --timestamp "$DMG"
          SUBMIT_OUT=$(xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --output-format json \
            --wait)
          echo "$SUBMIT_OUT"
          SUBMIT_ID=$(echo "$SUBMIT_OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          STATUS=$(echo "$SUBMIT_OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          if [ "$STATUS" != "Accepted" ]; then
            echo "::group::notarytool log for DMG $SUBMIT_ID (status=$STATUS)"
            xcrun notarytool log "$SUBMIT_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" || true
            echo "::endgroup::"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/Bacalhau-*-macos.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install webkit2gtk
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Build binary
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build -tags "desktop,production,webkit2_41" \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o build/Bacalhau .

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd build
          tar czf "Bacalhau-${VERSION}-linux-amd64.tar.gz" Bacalhau

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/Bacalhau-*-linux-amd64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build -tags "desktop,production" \
            -ldflags "-s -w -X main.version=$VERSION -H windowsgui" \
            -o build/Bacalhau.exe .

      - name: Package zip
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd build
          7z a "Bacalhau-${VERSION}-windows-amd64.zip" Bacalhau.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/Bacalhau-*-windows-amd64.zip

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Bacalhau-*-macos.dmg
            Bacalhau-*-linux-amd64.tar.gz
            Bacalhau-*-windows-amd64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
